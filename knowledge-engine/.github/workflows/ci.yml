name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python sources
        working-directory: knowledge-engine
        run: python -m compileall -q .
      - name: Run unit tests
        working-directory: knowledge-engine
        run: python -m unittest discover -s tests -v
